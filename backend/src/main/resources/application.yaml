server:
  port: 9192

spring:
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://localhost:3306/hotel
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
      file-size-threshold: 2KB

security:
  jwt:
    secret-key: 36763979244226452948404D635166546A576D5A7134743777217A25432A462D
    expire-length: 3600000

# Default admin account (can be overridden by env vars or other profiles)
app:
  admin:
    email: admin@gmail.com
    password: admin123

logging:
  level:
    org.springframework.security: DEBUG
